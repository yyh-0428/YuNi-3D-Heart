<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fcfafb">
  <meta name="description" content="予你。一颗真实形态的心脏，一段只为你存在的心跳。可旋转的原创 Three.js 心脏与同步心跳声。">
  <title>予你 · A heart, for you</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23fcf4f6'/%3E%3Cpath d='M5 17h6l3-7 4 13 3-6h6' fill='none' stroke='%23b9657e' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>/* APP_CSS */</style>
</head>
<body>
  <div class="page">
    <header class="masthead">
      <a class="wordmark" href="#" aria-label="予你，回到初始视角" id="brand"><span class="wordmark-cn">予你</span><span class="wordmark-rule"></span><span class="wordmark-en">A HEART, FOR YOU</span></a>
      <div class="header-right"><span class="edition">把心动，交给时间。</span>
        <fieldset class="palette-picker">
          <legend class="sr-only">心脏配色</legend>
          <label class="palette-option"><input type="radio" name="palette" value="soft" checked><span><i class="swatch swatch-soft" aria-hidden="true"></i>柔粉</span></label>
          <label class="palette-option"><input type="radio" name="palette" value="natural"><span><i class="swatch swatch-natural" aria-hidden="true"></i>真实</span></label>
        </fieldset>
      </div>
    </header>
    <main class="composition">
      <section class="intro" aria-labelledby="page-title">
        <div class="eyebrow"><span></span> THE SHAPE OF LOVE</div>
        <h1 id="page-title">每一次心动，<br>都<span class="soft-word">为你。</span></h1>
        <p class="intro-text">有些话，心跳会替我说。</p>
        <button id="sound" class="sound-button" type="button" aria-pressed="false">
          <span class="sound-symbol" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
          <span id="sound-label">听见心跳</span><span class="sound-arrow" aria-hidden="true">↗</span>
        </button>
        <span class="sound-hint" id="sound-hint">轻触，听一听此刻。</span>
      </section>
      <div class="sculpture" id="stage" tabindex="0" role="region" aria-label="可交互的三维人体心脏。拖动旋转，双指或滚轮缩放。键盘方向键旋转，加减键缩放，Home 键复位。">
        <div class="aura" aria-hidden="true"></div>
        <canvas id="heart-canvas" aria-label="淡玫瑰色人体心脏，正在轻柔跳动"></canvas>
        <div class="ground-shadow" aria-hidden="true"></div>
        <div id="loading" class="loading" role="status"><span></span>心动，即将发生</div>
        <div id="webgl-error" class="webgl-error" role="alert" hidden>暂时无法显示 3D 心脏。<br><small>请使用支持 WebGL 2 的浏览器，并开启硬件加速。</small><button id="reload" type="button">重新打开</button></div>
      </div>
      <aside class="margin-note" aria-hidden="true"><span class="note-line"></span><span>一颗心 · 一种偏爱</span></aside>
      <div class="model-caption"><span class="caption-mark" aria-hidden="true">◌</span><span id="gesture-hint">拖动旋转 · 滚轮缩放</span></div>
    </main>
    <footer class="control-bar" aria-label="心跳控制">
      <div class="pulse-readout">
        <canvas id="ecg" width="150" height="42" aria-hidden="true"></canvas>
        <div class="bpm"><span id="bpm-display">72</span><span class="bpm-unit">BPM</span></div>
        <span class="pulse-state" id="pulse-state">此刻的心跳</span>
      </div>
      <div class="tempo-control"><label for="tempo">心动的节奏</label><input type="range" id="tempo" min="50" max="110" value="72" step="1" aria-valuetext="每分钟 72 次"><span class="tempo-limits" aria-hidden="true">50 — 110</span></div>
      <div class="view-controls">
        <button class="icon-button" id="pause" type="button" aria-label="暂停跳动" title="暂停跳动" aria-pressed="false"><svg class="pause-glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6v12M15 6v12"/></svg><svg class="play-glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 9 6-9 6Z"/></svg></button>
        <button class="orbit-button" id="orbit" type="button" aria-pressed="false" title="自动环绕"><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="12" rx="9" ry="4.5" transform="rotate(-30 12 12)"/><path d="m17 3 3 2-1 3"/></svg><span>环绕</span></button>
        <button class="icon-button" id="reset" type="button" aria-label="恢复初始视角" title="恢复初始视角"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10a8 8 0 1 1 1.7 7M4 5v5h5"/></svg></button>
      </div>
    </footer>
    <div class="colophon"><span>LOVE, IN EVERY BEAT.</span><span>致独一无二的你</span></div>
    <span class="sr-only" id="announcement" role="status" aria-live="polite"></span>
  </div>
  <noscript><p class="noscript">请开启 JavaScript，以观看心脏跳动。</p></noscript>
  <script>/* APP_SCRIPT */</script>
</body>
</html>
